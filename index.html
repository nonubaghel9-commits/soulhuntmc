<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoulHuntMC – Premium Minecraft Server</title>
<meta name="description" content="SoulHuntMC is a premium Minecraft server. Join at play.soulhuntmc.xyz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3eff8;--muted:#a9a2b8;--org:#e8a04d;--pan:#221e2b;--hi:#3b3647;--lo:#0e0c13;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
body{margin:0;background:#16131b url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA0UlEQVR42oWTUQrCQAxEcwfRqhRaBD+8/wFbsvCW5yD4EbabTSaTZFrb+jlul/3ok++29fEexhu+5/Ia9/t1G/dqRz9yGggAx2AUKB5AzeQ+8ZPs2AnQDmi1r79JcBFi+a6kRKANENgA3mdxIdBAptzmtmi1SHA1J1DJbTmnWFu2wqCgD3UPc8zAtDKYtf7SA/5iMAayiNxebuNrC1Q2fasURjCdQrJ8rYncBoAe7pyBe3aVZOR3ipWl+U99AFoflfs1kHXBmT9epdM7du85VOwEtZtUEwmgPqIAAAAASUVORK5CYII=) 0 0/64px 64px;image-rendering:pixelated;color:var(--ink);font:500 16px/1.6 Montserrat,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#120f18;z-index:10}
h1,h2{font-family:'Pixelify Sans','Segoe UI',monospace;margin:0;line-height:1.1;text-shadow:3px 3px 0 rgba(0,0,0,.55)}
a{color:inherit}
:focus-visible{outline:3px solid var(--org);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-right)) 0 max(22px,env(safe-area-inset-left))}
.box,.ip,.stairs li,.srv,.card,.panel,.faq details,.soc{background:var(--pan);border:2px solid #000;box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#120f18;border-bottom:2px solid #000;box-shadow:0 2px 0 #2b2735}
nav .wrap{display:flex;align-items:center;gap:12px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 22px 'Pixelify Sans',monospace;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.brand img{width:46px;height:auto;image-rendering:auto}
.right{margin-left:auto;display:flex;align-items:center;gap:16px}
.mw{position:relative}
#mbtn{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 15px;color:var(--ink);font:700 15px Montserrat,sans-serif;cursor:pointer}
#mbtn:hover,.soc:hover{background:#2f2a3b}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:min(212px,calc(100vw - 28px));margin:0;padding:6px;list-style:none}
.menu a{display:block;padding:11px 14px;text-decoration:none;font-weight:600;font-size:15px}
.menu a:hover{background:#3a3447}
.login{display:flex;align-items:center;gap:12px;text-decoration:none;text-align:right;line-height:1.2}
.login b{display:block;font-weight:500;font-size:20px}
.login small{display:block;font:700 12.5px Montserrat,sans-serif;letter-spacing:.3px;color:var(--org)}
.login:hover small{color:#ffc27a}
.login img{width:52px;height:52px;border-radius:10px;display:block;box-shadow:0 0 0 2px #000}
.hero{text-align:center;padding:50px 0 62px}
.logo{width:min(470px,84vw);height:auto;display:block;margin:0 auto;image-rendering:auto;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
h1{font-size:clamp(32px,7.6vw,60px);font-weight:700;margin:14px auto 12px}
.lead{max-width:46ch;margin:0 auto 28px;color:var(--muted);font-size:clamp(16px,2.4vw,19px)}
.ip{display:inline-flex;gap:6px;max-width:100%;padding:6px;background:#0d0b12}
.ip code{font:500 clamp(20px,5.6vw,32px) 'Pixelify Sans',monospace;padding:8px 18px;display:flex;align-items:center;overflow-wrap:anywhere}
.copy{font:700 18px 'Pixelify Sans',monospace;color:#fff;background:#3f8a2a;border:2px solid #000;box-shadow:inset 3px 3px 0 #6fc24c,inset -3px -3px 0 #28591b;text-shadow:2px 2px 0 rgba(0,0,0,.4);padding:0 26px;min-height:50px;min-width:108px;cursor:pointer}
.copy:hover{background:#4a9c33}
.copy:active{box-shadow:inset 3px 3px 0 #28591b,inset -3px -3px 0 #6fc24c}
.note{margin:16px 0 0;font-size:14px;color:var(--muted)}
.strip{padding:8px 0 72px}
.srv{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px;max-width:760px;margin:0 auto 64px;padding:14px 18px;background:#0d0b12}
.srv-ico{width:66px;height:66px;object-fit:contain;background:#16131b;border:2px solid #000;image-rendering:auto}
.srv-txt{display:grid;gap:1px;min-width:0;line-height:1.3}
.srv-txt b{font:700 22px 'Pixelify Sans',monospace}
.motd{color:#bdb6cb;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver{color:#7d768b;font-size:13px}
.srv-st{display:grid;justify-items:end;gap:8px;font:700 14px Montserrat,sans-serif;color:var(--muted)}
.srv.on .pl{color:#fff}
.ping{display:flex;align-items:flex-end;gap:2px;height:16px}
.ping i{display:block;width:4px;background:#3a3544}
.ping i:nth-child(1){height:4px}.ping i:nth-child(2){height:7px}.ping i:nth-child(3){height:10px}.ping i:nth-child(4){height:13px}.ping i:nth-child(5){height:16px}
.srv.on .ping i{background:#5be85b}
.strip h2{font-size:clamp(26px,4.4vw,38px);text-align:center;margin-bottom:26px}
.stairs{display:flex;align-items:flex-end;gap:10px;list-style:none;margin:0;padding:54px 0 0}
.stairs li{position:relative;flex:1;min-width:0;min-height:calc(78px + var(--n)*30px);display:flex;justify-content:center;padding-top:14px;border-top:12px solid var(--c);font:700 clamp(15px,2.2vw,24px) 'Pixelify Sans',monospace;color:var(--c);text-shadow:2px 2px 0 rgba(0,0,0,.7)}
.cr{position:absolute;left:50%;top:-58px;width:42px;height:42px;transform:translateX(-50%)}
footer{position:relative;background:#2a1d14 url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA2ElEQVR42m2TOw4CMQxEfQkKEBIUFFsgQUNDQ8H9z7SrWelFb60UkR3/MnbG9X/f1u9yXiPRf8/r0F/30y4/j8u4xxeZuCIhJ0FxWsae4BzfiS8cOehJJsC+2PIgj+4FgOWq3A3VuotU75t2sLsgczC6ohrDogjJht8HGb0I8ss+no3bxV7d6eQ+cdAaWc3671ygeB/mKGAE3P2V/l4KgLY8aUM3oWznZfxlBjrZgzLdkaCtbvRO9D0w/LELnSjmfueE0Ryo7K8x2/qSgehAJPc+C3Rbs23dAIWXesW2AEysAAAAAElFTkSuQmCC) 0 0/64px 64px;border-top:2px solid #000;padding:54px 0 30px;text-align:center;color:#d6c7b4;font-size:13.5px}
footer::before{content:"";position:absolute;left:0;right:0;top:0;height:24px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAGCAYAAADKfB7nAAAAaklEQVR42mNwbzD4D8M+XUb/g6Za/bcv0QSzQTQIw+Rh4iAM4oPUMoAImEaYIcgKYXx0i2BsBphJyCYjGwBzEQzD+HAXgBQxAAGKqVAAUgijQYrBGtABTBGy8xiwAFziDDBTkf2KTx06AABFK4MT++gz7AAAAABJRU5ErkJggg==) 0 0/64px 24px repeat-x}
.socs{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.soc{display:grid;place-items:center;width:50px;height:50px;color:#e9dfd2}
footer p{margin:0}
@media (max-width:640px){nav .wrap{height:66px;gap:8px;padding:0 14px}.right{gap:10px}#mbtn span{display:none}#mbtn{padding:0 13px}.brand span{display:none}.brand img{width:42px}.login b{font-size:17px}.login small{font-size:11px}.login img{width:44px;height:44px}.hero{padding:34px 0 44px}.strip{padding-bottom:48px}.feats b{font-size:15px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (max-width:640px){.srv{grid-template-columns:auto 1fr;gap:12px 14px;padding:12px 14px;margin-bottom:48px}.srv-ico{width:56px;height:56px}.srv-txt b{font-size:19px}.srv-st{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.stairs{flex-direction:column;align-items:flex-start;gap:8px;padding-top:0}.stairs li{flex:none;width:calc(36% + var(--n)*12.8%);min-height:54px;align-items:center;justify-content:flex-start;padding:0 16px;border:2px solid #000;border-left:12px solid var(--c);font-size:19px}.cr{top:50%;left:auto;right:12px;transform:translateY(-50%);width:34px;height:34px}}
@media (max-width:480px){.ip{flex-direction:column;width:100%}.ip code{justify-content:center;font-size:clamp(18px,6vw,24px)}.copy{width:100%}}
@media (min-width:1100px){.hero{padding:66px 0 80px}.logo{width:520px}.lead{font-size:20px}}
section{scroll-margin-top:100px}
.strip .srv{margin-bottom:0}
.links{display:none;gap:4px;list-style:none;margin:0 0 0 18px;padding:0}
.links a{display:block;padding:10px 12px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}
.links a:hover{color:var(--ink)}
.sub{max-width:52ch;margin:-10px auto 30px;text-align:center;color:var(--muted);font-size:clamp(15px,2.2vw,17px)}
.sub b{color:var(--org)}
.grid,.two{display:grid;gap:14px}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{display:flex;gap:16px;align-items:flex-start;padding:20px}
.card img{width:40px;height:40px;flex:none;margin-top:2px}
.card h3,.panel h3{margin:0;font:700 21px 'Pixelify Sans',monospace}
.card p{margin:4px 0 0;color:var(--muted);font-size:14.5px;line-height:1.55}
.panel{padding:22px}
.panel p{margin:8px 0 18px;color:var(--muted)}
.steps{list-style:none;counter-reset:s;margin:16px 0 0;padding:0;display:grid;gap:14px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;display:grid;place-items:center;font:700 17px 'Pixelify Sans',monospace;color:#fff;background:#3f8a2a;border:2px solid #000;box-shadow:inset 2px 2px 0 #6fc24c,inset -2px -2px 0 #28591b}
.steps b{color:var(--org)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;font:700 17px 'Pixelify Sans',monospace;text-decoration:none;color:#fff;border:2px solid #000;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.dc{background:#5865f2;box-shadow:inset 3px 3px 0 #8b95ff,inset -3px -3px 0 #3a45b8}
.dc:hover{background:#6b77ff}
.off{background:#3a3544;color:#a9a2b8;text-shadow:none;box-shadow:inset 3px 3px 0 #4a4458,inset -3px -3px 0 #26222e;cursor:not-allowed}
.faq{max-width:760px}
.faq h2{margin-bottom:24px}
.faq details{margin-bottom:10px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;padding:12px 18px;font:700 18px 'Pixelify Sans',monospace}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;line-height:1;color:var(--org)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:0;padding:0 18px 18px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:32px;text-align:left}
.fb{display:block;font:700 24px 'Pixelify Sans',monospace;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.fp{margin:8px 0 16px;max-width:34ch}
.fh{display:block;font:700 18px 'Pixelify Sans',monospace;color:#fff;margin-bottom:10px}
.fl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.fl a{display:inline-block;padding:6px 0;text-decoration:none;color:#d6c7b4}
.fl a:hover{color:#fff;text-decoration:underline}
.fgrid .socs{justify-content:flex-start;margin:16px 0 0}
.ip.sm code{font-size:18px;padding:6px 12px}
.ip.sm .copy{min-height:42px;font-size:16px;padding:0 16px;min-width:0}
.fbot{margin-top:34px;padding-top:18px;border-top:2px solid rgba(0,0,0,.35)}
@media (min-width:960px){.links{display:flex}}
@media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}
h1,h2,.lead,.sub{text-wrap:balance}
nav .wrap{position:relative}
.mw{position:static}
.menu{top:calc(100% + 10px);right:22px;left:auto;width:250px;padding:8px;display:grid;gap:6px;z-index:20}
.menu a{display:flex;align-items:center;gap:14px;padding:8px 12px 8px 8px;font:700 18px 'Pixelify Sans',monospace;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.mi{display:grid;place-items:center;flex:none;width:44px;height:44px;background:#0d0b12;border:2px solid #000;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.mi img{width:28px;height:28px}
.mi.dc{color:#8b95ff}
.mi.ig{color:#ff7ab0}
.stairs li{flex-direction:column;align-items:center;gap:10px;padding-top:16px}
.ri{width:40px;height:40px;flex:none}
@media (max-width:640px){.menu{left:14px;right:14px;width:auto;grid-template-columns:1fr 1fr}.menu a{flex-direction:column;gap:8px;padding:14px 6px 12px;text-align:center;font-size:17px}.stairs li{flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:12px;padding:0 16px}.ri{width:32px;height:32px}}
</style>
</head>
